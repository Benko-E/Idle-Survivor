.draft-button {
  padding: 6px 14px; border: 1px solid #e8c468; border-radius: 6px;
  background: #1a2028; color: #e8c468; cursor: pointer;
  font: 13px ui-monospace, Consolas, monospace; letter-spacing: 0.04em;
}
.draft-button:hover { background: #242c36; }
.draft-button[hidden] { display: none; }

.draft-panel {
  position: fixed; inset: 0; z-index: 20; display: flex;
  align-items: center; justify-content: center; gap: 14px;
  background: rgba(6, 9, 12, 0.72); padding: 20px; flex-wrap: wrap;
}
.draft-panel[hidden] { display: none; }
/* The cards' own row: stretch makes every card as tall as the tallest, so they
   line up without a fixed height that long text could overflow. */
.draft-row { display: flex; gap: 14px; align-items: stretch; justify-content: center; flex-wrap: wrap; }

.draft-card {
  width: 250px; min-height: 130px; padding: 6px 8px; box-sizing: border-box;
  display: flex; flex-direction: column; gap: 8px;
  border: 1px solid #3a4a58; border-radius: 8px;
  background: #121820; cursor: pointer; text-align: left;
  font: 13px ui-monospace, Consolas, monospace; color: #9fb3c2;
}
.draft-card:hover { border-color: #e8c468; background: #18202a; filter: brightness(1.2); }
/* Skinned, the frame is part of the card's size, so the plain minimum is plenty. */
.draft-card.skin-panel { min-height: 0; justify-content: flex-start; }
.draft-card .kind { font-size: 11px; color: #7f9a6a; text-transform: uppercase; }
.draft-card.evolution .kind { color: #ffb347; }
.draft-card.evolution .name { color: #ffd98a; }
.draft-card .head { display: flex; gap: 10px; align-items: center; }
.draft-card .head img, .draft-card .head > span:first-child { width: 44px; height: 44px; flex: none; border-radius: 4px; }
.draft-card .name { font-size: 15px; color: #e8c468; }
.draft-card .desc { line-height: 1.45; }

.draft-dismiss {
  position: fixed; top: 18px; right: 18px;
  background: none; border: none; color: #9fb3c2; cursor: pointer;
  font: 13px ui-monospace, Consolas, monospace;
}

.spell-bar {
  position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 9;
  display: flex; gap: 8px; align-items: center; pointer-events: none;
  font: 11px ui-monospace, Consolas, monospace;
}
.spell-bar[hidden] { display: none; }
.spell-slot {
  position: relative; width: 44px; height: 44px; border-radius: 7px; box-sizing: content-box;
  border: 2px solid #2a3540; background: #0d1218cc; overflow: hidden;
  display: flex; align-items: center; justify-content: center; color: #6f8090;
}
.spell-slot img { width: 100%; height: 100%; display: block; }
.spell-slot.owned { border-color: var(--element); }
.spell-slot.empty { border-style: dashed; }
.spell-slot.waiting {
  border: 2px solid #c9a6ff; color: #e6d6ff; cursor: pointer; pointer-events: auto;
  animation: slot-glow 1.6s ease-in-out infinite;
}
@keyframes slot-glow {
  0%, 100% { box-shadow: 0 0 3px #c9a6ff66; }
  50% { box-shadow: 0 0 12px #c9a6ffcc; }
}
.build-badge {
  margin-left: 6px; padding: 5px 9px; border-radius: 6px; pointer-events: auto;
  border: 1px solid var(--badge); color: var(--badge); background: #0d1218cc;
  letter-spacing: 0.04em; white-space: nowrap;
}
.build-badge.hint { opacity: 0.55; border-style: dashed; }
.build-badge.prismatic {
  --badge: #e6d6ff;
  background: linear-gradient(90deg, #ff8a3d33, #8fd8ff33, #f1e05a33), #0d1218cc;
}
.spell-sweep {
  position: absolute; inset: 0; pointer-events: none;
  background: conic-gradient(rgba(6, 9, 12, 0.72) var(--left), transparent 0);
}

.thought {
  position: fixed; left: 0; top: 0; z-index: 8; pointer-events: none;
  max-width: 200px; padding: 2px 6px; background: #121820; border-radius: 6px;
  font: 12px ui-monospace, Consolas, monospace; line-height: 1.35; color: #e8e2cf;
  text-align: center; opacity: 0; transition: opacity 0.25s;
  transform: translate(-50%, -100%);
}
.thought.shown { opacity: 1; }
/* Thought, not speech: little bubbles trailing down to his head. */
.thought::before, .thought::after {
  content: ''; position: absolute; left: 50%; border-radius: 50%;
  background: #e8e2cf; box-shadow: 0 0 0 2px #121820;
}

.spell-button {
  padding: 6px 14px; border: 1px solid #c9a6ff; border-radius: 6px;
  background: #1f1830; color: #e6d6ff; cursor: pointer;
  font: 13px ui-monospace, Consolas, monospace; letter-spacing: 0.04em;
  animation: spell-glow 1.6s ease-in-out infinite;
}
.spell-button[hidden] { display: none; }
@keyframes spell-glow {
  0%, 100% { box-shadow: 0 0 4px #c9a6ff66; }
  50% { box-shadow: 0 0 16px #c9a6ffcc; }
}

.spell-panel {
  position: fixed; inset: 0; z-index: 20;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 16px; padding: 20px; background: rgba(6, 9, 12, 0.78);
  font: 13px ui-monospace, Consolas, monospace; color: #9fb3c2;
}
.spell-panel[hidden] { display: none; }
.spell-title { margin: 0; font-size: 22px; font-weight: normal; color: #e8c468; }
.spell-warning { margin: 0 0 6px; color: #d9a0a0; }
.spell-cards { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.spell-card {
  width: 220px; min-height: 170px; padding: 8px 10px;
  display: flex; flex-direction: column; gap: 8px; text-align: left;
  border: 2px solid var(--element); border-radius: 8px;
  background: #121820; color: #9fb3c2; cursor: pointer;
  font: 13px ui-monospace, Consolas, monospace;
}
.spell-card:hover { background: #18202a; box-shadow: 0 0 14px var(--element); filter: brightness(1.2); }
.spell-card .element { font-size: 11px; text-transform: uppercase; color: var(--element); }
.spell-card img { width: 56px; height: 56px; border-radius: 6px; border: 1px solid var(--element); }
.spell-card .name { font-size: 16px; color: #e8c468; }
.spell-card .desc { line-height: 1.45; flex: 1; }
.spell-card .locks { font-size: 11px; color: #7a8a96; }
.spell-card .completes { font-size: 11px; color: #e8c468; }
.spell-card .completes.none { color: #6f8090; }
.spell-later {
  position: fixed; top: 18px; right: 18px;
  background: none; border: none; color: #9fb3c2; cursor: pointer;
  font: 13px ui-monospace, Consolas, monospace;
}
